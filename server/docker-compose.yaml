services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
  app:
    build: {
      context: .
    }
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - 3333:3333
    